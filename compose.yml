services:
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: ${DB_DATABASE:-jejakbahari}
      POSTGRES_USER: ${DB_USERNAME:-jejakbahari}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-jejakbahari}
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${DB_USERNAME:-jejakbahari} -d ${DB_DATABASE:-jejakbahari}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-jejakbahari}
      DB_USERNAME: ${DB_USERNAME:-jejakbahari}
      DB_PASSWORD: ${DB_PASSWORD:-jejakbahari}
    ports:
      - '8000:8000'
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    env_file:
      - ./worker/.env
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000/api/internal/v1
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres-data:
