# JejakBahari Nginx configuration — production VPS.
# Place at /etc/nginx/sites-available/jejakbahari, symlink to sites-enabled.
#
# Covers:
# - HTTPS termination (cert via Let's Encrypt / certbot)
# - Backend API reverse proxy (php-fpm or artisan serve)
# - Reverb WebSocket proxy (/app → 127.0.0.1:8080)
# - Security headers at edge
# - Request size limit for AIS ingestion
# - Rate limit zone for public API

# Rate limit zone: 10 req/s per IP for public API burst protection.
limit_req_zone $binary_remote_addr zone=jejakbahari_api:10m rate=10r/s;

# Upstream for Laravel backend (php artisan serve or php-fpm socket).
upstream jejakbahari_backend {
    server 127.0.0.1:8000;
    # For php-fpm: use fastcgi_pass unix:/run/php/php8.4-fpm.sock instead.
    keepalive 32;
}

# Upstream for Reverb WebSocket server.
upstream jejakbahari_reverb {
    server 127.0.0.1:8080;
    keepalive 32;
}

# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name api.jejakbahari.example.com;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — main API + WebSocket
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.jejakbahari.example.com;

    # TLS — replace with real cert paths (certbot: /etc/letsencrypt/live/<domain>/)
    ssl_certificate     /etc/letsencrypt/live/api.jejakbahari.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.jejakbahari.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers (edge level)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # CSP untuk API responses (JSON only — no resources needed)
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;

    # Max body size — AIS payloads are small; 1MB is generous headroom.
    client_max_body_size 1m;

    access_log /var/log/nginx/jejakbahari-access.log;
    error_log  /var/log/nginx/jejakbahari-error.log;

    # ── Reverb WebSocket ─────────────────────────────────────────────
    # Reverb serves WS at /app/<key>. Long timeouts for persistent conn.
    location /app {
        proxy_pass http://jejakbahari_reverb;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;   # 24h — WS connections are long-lived
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    # ── Public API (rate limited) ────────────────────────────────────
    location /api/v1/ {
        limit_req zone=jejakbahari_api burst=20 nodelay;

        proxy_pass http://jejakbahari_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ── Internal worker API (no rate limit zone — bearer token guard;
    #    worker burst can hit 50 msg/s which exceeds public zone) ─────
    location /api/internal/ {
        proxy_pass http://jejakbahari_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;

        # Optional: restrict to worker IP if it runs on same host
        # allow 127.0.0.1;
        # deny all;
    }

    # ── Admin API (stricter rate limit) ──────────────────────────────
    location /api/v1/admin/ {
        limit_req zone=jejakbahari_api burst=5 nodelay;

        proxy_pass http://jejakbahari_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check — no rate limit (monitoring needs reliable access)
    location = /up {
        proxy_pass http://jejakbahari_backend;
        proxy_set_header Host $host;
        proxy_read_timeout 5s;
    }

    # Everything else → backend (Laravel routes)
    location / {
        proxy_pass http://jejakbahari_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
